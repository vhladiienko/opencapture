<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>hairline</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111115; }
      #col { width: 663px; margin: 0 auto; }
      /* A sub-MIN_HEIGHT fixed hairline parked at the very top of the viewport,
         like reader overlays ship: below the pinned-element size floor, so the
         sweep must not waste thought on it — but visible in every slice. */
      #topline {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 1px;
        background: rgba(255, 255, 255, 0.04);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="col"><canvas id="cv"></canvas></div>
    <div id="topline"></div>
    <script>
      const PAGE_W = 663;
      const PAGE_H = 12000;
      const dpr = window.devicePixelRatio;
      const cv = document.getElementById("cv");
      cv.width = Math.round(PAGE_W * dpr);
      cv.height = Math.round(PAGE_H * dpr);
      cv.style.width = PAGE_W + "px";
      cv.style.height = PAGE_H + "px";
      const ctx = cv.getContext("2d");
      for (let r = 0; r < cv.height; r++) {
        const v = 25 + ((r * 11) % 60);
        ctx.fillStyle = `rgb(${v},${v},${v + 4})`;
        ctx.fillRect(0, r, cv.width, 1);
      }
    </script>
  </body>
</html>
